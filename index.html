<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accurate Animated Venous Flow & Stasis</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; background: #0f172a; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); width: 920px; color: #f8fafc; }
    h2 { text-align: center; margin: 0; color: #38bdf8; }
    p.sub { text-align: center; color: #94a3b8; margin-top: 5px; margin-bottom: 16px; font-size: 14px; }
    .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; font-size: 12.5px; font-weight: bold; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .normal-flow { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .reflux-flow { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .stasis-box { background: #7f1d1d; border: 1px solid #ef4444; }

    /* Keyframe Animations */
    @keyframes flowUpward {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowToRightAndDown {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulseStasis {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }

    /* Normal Upward Flows */
    .flow-deep {
      stroke: #38bdf8;
      stroke-width: 4;
      stroke-dasharray: 6, 10;
      animation: flowUpward 1.2s linear infinite;
    }
    .flow-super {
      stroke: #7dd3fc;
      stroke-width: 3.5;
      stroke-dasharray: 6, 8;
      animation: flowUpward 1.6s linear infinite;
    }
    .flow-perf {
      stroke: #fb923c;
      stroke-width: 3;
      stroke-dasharray: 5, 6;
      animation: flowUpward 1s linear infinite;
    }

    /* Fixed Reflux (Deep -> Superficial -> Downwards) */
    .flow-reflux-out {
      stroke: #ef4444;
      stroke-width: 5;
      stroke-dasharray: 8, 8;
      animation: flowToRightAndDown 0.9s linear infinite;
    }
    .flow-tortuous-down {
      stroke: #f87171;
      stroke-width: 5;
      stroke-dasharray: 8, 8;
      animation: flowToRightAndDown 1.1s linear infinite;
    }

    /* Stagnant/Dead Pool (Zero Net Flow) */
    .stasis-pool {
      transform-origin: 640px 855px;
      animation: pulseStasis 2s ease-in-out infinite;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Corrected: Venous Hemodynamics & Real Stasis</h2>
  <p class="sub">Normal Upward Flow vs. True Deep-to-Superficial Reflux & Trapped Venous Stasis</p>

  <div class="legend">
    <div class="legend-item"><span class="dot normal-flow"></span> Normal Flow (Upward to Heart)</div>
    <div class="legend-item"><span class="dot reflux-flow"></span> Pathological Reflux (Outward & Downward)</div>
    <div class="legend-item"><span class="dot stasis-box"></span> True Stasis (Trapped / No Forward Flow)</div>
  </div>

  <svg viewBox="0 0 880 1020" width="100%" height="980">
    <defs>
      <marker id="arr-d" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#38bdf8"/></marker>
      <marker id="arr-r" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 z" fill="#ef4444"/></marker>
    </defs>

    <!-- Levels -->
    <line x1="30" y1="320" x2="850" y2="320" stroke="#475569" stroke-dasharray="4,4"/>
    <text x="40" y="312" fill="#64748b" font-size="11" font-weight="bold">INGUINAL LIGAMENT / GROIN</text>

    <line x1="30" y1="560" x2="850" y2="560" stroke="#475569" stroke-dasharray="4,4"/>
    <text x="40" y="552" fill="#64748b" font-size="11" font-weight="bold">KNEE JOINT LEVEL</text>

    <line x1="30" y1="880" x2="850" y2="880" stroke="#475569" stroke-dasharray="4,4"/>
    <text x="40" y="872" fill="#64748b" font-size="11" font-weight="bold">ANKLE / GAITER ZONE</text>

    <!-- Deep Vessels (Static Structure) -->
    <rect x="270" y="35" width="220" height="42" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="380" y="61" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">INFERIOR VENA CAVA (IVC)</text>

    <rect x="280" y="120" width="200" height="40" rx="8" fill="#1d4ed8"/>
    <text x="380" y="145" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Common Iliac Vein</text>

    <rect x="280" y="205" width="200" height="40" rx="8" fill="#2563eb"/>
    <text x="380" y="230" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">External Iliac Vein</text>

    <rect x="290" y="325" width="180" height="28" rx="14" fill="#15803d"/>
    <text x="380" y="344" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">SFJ (Saphenofemoral)</text>

    <rect x="280" y="375" width="200" height="145" rx="8" fill="#1e40af"/>
    <text x="380" y="440" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">FEMORAL VEIN</text>
    <text x="380" y="462" fill="#93c5fd" font-size="11" text-anchor="middle">(Deep High-Pressure Trunk)</text>

    <rect x="280" y="580" width="200" height="70" rx="8" fill="#2563eb"/>
    <text x="380" y="615" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">POPLITEAL VEIN</text>

    <rect x="175" y="600" width="110" height="24" rx="12" fill="#15803d"/>
    <text x="230" y="616" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">SPJ Junction</text>

    <rect x="280" y="710" width="200" height="145" rx="8" fill="#1d4ed8"/>
    <text x="380" y="765" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">TIBIAL VEINS</text>
    <text x="380" y="785" fill="#93c5fd" font-size="11" text-anchor="middle">(Calf Muscle Pump)</text>

    <rect x="580" y="375" width="130" height="290" rx="8" fill="#0284c7"/>
    <text x="645" y="515" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(90, 645, 515)">GSV (Normal Superficial)</text>

    <rect x="80" y="650" width="135" height="205" rx="8" fill="#0369a1"/>
    <text x="147" y="745" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SMALL SAPHENOUS (SSV)</text>

    <rect x="100" y="905" width="670" height="42" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="435" y="931" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">DORSAL VENOUS ARCH (Foot / Origin)</text>

    <!-- Normal Upward Animated Lines -->
    <line x1="380" y1="905" x2="380" y2="855" class="flow-deep" marker-end="url(#arr-d)"/>
    <line x1="380" y1="710" x2="380" y2="650" class="flow-deep" marker-end="url(#arr-d)"/>
    <line x1="380" y1="580" x2="380" y2="520" class="flow-deep" marker-end="url(#arr-d)"/>
    <line x1="380" y1="365" x2="380" y2="247" class="flow-deep" marker-end="url(#arr-d)"/>
    <line x1="380" y1="205" x2="380" y2="162" class="flow-deep" marker-end="url(#arr-d)"/>
    <line x1="380" y1="120" x2="380" y2="79"  class="flow-deep" marker-end="url(#arr-d)"/>

    <line x1="147" y1="905" x2="147" y2="855" class="flow-super"/>
    <path d="M 147 650 C 147 611, 160 611, 230 611" fill="none" class="flow-super"/>
    <path d="M 645 375 C 645 338, 480 338, 380 338" fill="none" class="flow-super"/>

    <!-- Healthy Perforators (Superficial to Deep) -->
    <line x1="580" y1="410" x2="480" y2="410" class="flow-perf"/>
    <text x="530" y="402" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">Hunterian →</text>

    <line x1="580" y1="475" x2="480" y2="475" class="flow-perf"/>
    <text x="530" y="467" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">Dodd's →</text>

    <line x1="580" y1="675" x2="480" y2="720" class="flow-perf"/>
    <text x="530" y="692" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">Boyd's →</text>

    <!-- ==================== CORRECTED REFLUX & STASIS ==================== -->
    
    <!-- 1. Real Reflux: Shoots FROM Deep (x:480) TO Superficial (x:600) -->
    <line x1="480" y1="790" x2="600" y2="790" class="flow-reflux-out" marker-end="url(#arr-r)"/>
    <rect x="495" y="760" width="130" height="24" rx="4" fill="#450a0a" stroke="#ef4444"/>
    <text x="560" y="776" fill="#fca5a5" font-size="9.5" font-weight="bold" text-anchor="middle">REVERSE REFLUX →</text>

    <!-- 2. Tortuous Vein: Blood Forced DOWNWARD by Gravity & Reflux Pressure -->
    <path d="M 645 665 
             C 645 700, 680 720, 620 745 
             C 570 770, 710 790, 630 820 
             C 570 850, 680 840, 640 855" 
          fill="none" stroke="#7f1d1d" stroke-width="12" stroke-linecap="round"/>
    <!-- Animated downward path stopping AT the ulcer, NOT flowing through it -->
    <path d="M 645 665 
             C 645 700, 680 720, 620 745 
             C 570 770, 710 790, 630 820 
             C 570 850, 680 840, 640 855" 
          fill="none" class="flow-tortuous-down"/>

    <!-- 3. Real Stasis Pool: NO FLOWING DOTS, ONLY CONGESTED PULSATING POOL -->
    <g class="stasis-pool">
      <ellipse cx="640" cy="860" rx="38" ry="26" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
      <circle cx="630" cy="855" r="3" fill="#fca5a5"/>
      <circle cx="645" cy="865" r="4" fill="#ef4444"/>
      <circle cx="652" cy="852" r="3" fill="#b91c1c"/>
      <circle cx="635" cy="868" r="2.5" fill="#fca5a5"/>
      <text x="640" y="863" fill="#ffffff" font-size="8.5" font-weight="bold" text-anchor="middle">STASIS POOL</text>
    </g>

    <!-- Callouts -->
    <text x="760" y="850" fill="#f87171" font-size="11" font-weight="bold">GAITER ZONE STASIS</text>
    <text x="760" y="865" fill="#fca5a5" font-size="9.5">• No Forward Drainage (Trapped)</text>
    <text x="760" y="878" fill="#fca5a5" font-size="9.5">• Capillary Leak & Venous Ulcer</text>
  </svg>
</div>

</body>
</html>
